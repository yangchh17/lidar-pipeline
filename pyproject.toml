[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-pipeline"
version = "0.2.0"
description = "Python CLI wrapper for the R-based LiDAR terrain processing pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "laspy>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "psutil>=5.9",
    "streamlit>=1.30",
    "folium>=0.15",
    "streamlit-folium>=0.15",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
lidar-pipeline = "lidar_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["lidar_pipeline*"]
