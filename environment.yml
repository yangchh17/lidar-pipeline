name: lidar-pipeline
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - r-base>=4.2
  - r-lidr
  - r-terra
  - r-argparse
  - r-yaml
  - r-futile.logger
  - r-r6
  - r-jsonlite
  - r-progress
  - pip
  - pip:
      - click>=8.1
      - laspy>=2.5
      - pyyaml>=6.0
      - tqdm>=4.66
      - psutil>=5.9
      - streamlit>=1.30
      - plotly>=5.18
      - rasterio>=1.3
      - numpy>=1.24
      - folium>=0.15
      - streamlit-folium>=0.18
      - Pillow>=10.0
